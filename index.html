<html>
<head>
<title>Mandelbrot</title>
<script src="Complex.js"></script>
<script src="Pixel.js"></script>
</head>
<body bgcolor="#000000">
<script>
(function() {

    var ROWS = 40;
    var COLS = 100;
    var ITERATION_LIMIT = 15;

    var params = new URLSearchParams(window.location.search);
    var ox, oy, zoom, width, halfWidth, left, top, row, col, x, y, nextzoom, pixels, p, it, minIt, maxIt;

    var result = '';

    ox = parseFloat(params.get('ox') || -0.6);
    oy = parseFloat(params.get('oy') || 0.0);
    zoom = parseFloat(params.get('zoom') || 1.0);
    if (isNaN(ox) || isNaN(oy) || isNaN(zoom) || zoom < 1.0) {
        ox = -0.6;
        oy = 0.0;
        zoom = 1.0;
    }

    width = 2.4 / zoom;
    halfWidth = width / 2.0;
    left = ox - halfWidth;
    top = oy + halfWidth;
    nextzoom = zoom * 1.5;

    pixels = new Array();

    for (row = 0; row < ROWS; ++row) {

        pixels[row] = new Array();

        y = top - width * row / (ROWS - 1);

        for (col = 0; col < COLS; ++col) {

            x = left + width * col / (COLS - 1);

            p = new Pixel(x, y);
            it = p.determine(ITERATION_LIMIT);
            pixels[row][col] = p;
            if (it >= 0) {
                if (minIt === undefined || it < minIt) {
                    minIt = it;
                }
                if (maxIt === undefined || it > maxIt) {
                    maxIt = it;
                }
            }

        }
    }

    for (row = 0; row < ROWS; ++row) {
        for (col = 0; col < COLS; ++col) {
            p = pixels[row][col];
            result += '<a href="?ox=' + p.c.r + '&oy=' + p.c.i + '&zoom=' + nextzoom + '"><font color="' + p.getColor(minIt, maxIt) + '" size="-2">o</font></a>';
        }
        result += '<br />';
    }

    result += '<br /><font color="#ffffff" size="-1">Code available at <a href="https://github.com/lafiosca/mandelbrot"><font color="#ffffff">Github</font></a></font>';

    document.body.innerHTML = result;

})();
</script>
</body>
</html>
